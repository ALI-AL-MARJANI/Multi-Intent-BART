base: _base.yaml
experiment_name: mixatis_bart-base_no-pointer
dataset: mixatis

data:
  train_path: data/raw/mixatis/train.txt
  dev_path: data/raw/mixatis/dev.txt
  test_path: data/raw/mixatis/test.txt

# Ablation: word positions are generated as <pos:k> classes instead of pointers.
model:
  backbone: facebook/bart-base
  use_pointer: false
